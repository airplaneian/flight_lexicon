<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contrail: Flighty importer demo</title>
    <meta name="description" content="Import selected flights from a Flighty CSV export into your own atproto repository as Contrail records. Runs entirely in the browser." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9992;&#65039;</text></svg>" />
  </head>
  <body>
    <!--NAV-->

    <header class="masthead">
      <h1>Flighty importer demo</h1>
      <p class="tagline">
        This tool parses a Flighty CSV export and lets you select flights to publish to your AT
        Protocol repository, using the flight record defined in the Contrail lexicons. The file is
        parsed in this page and never uploaded. For details on how this works, see the
        <a href="/import/docs/">importer docs</a>.
      </p>
    </header>

    <main>
      <section>
        <div id="app">
          <noscript>
            <p class="aside">The importer needs JavaScript. The rest of this page does not.</p>
          </noscript>
        </div>
      </section>
    </main>

    <!--FOOTER-->

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
